[project]
name = "fsaudit"
version = "0.1.0"
description = "Outil CLI d'audit de fichiers : scan SQLite, doublons, top, diff"
readme = "README.md"
authors = [
    { name = "6c9r", email = "binetmatthieu@outlook.com" }
]
requires-python = ">=3.13"
dependencies = [
    "python-dotenv>=1.2.4",
    "typer>=0.28.0",
]

[project.scripts]
fsaudit = "fsaudit.cli:app"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
